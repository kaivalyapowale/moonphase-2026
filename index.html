<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moon phases, sunrise, sunset, moonrise and moonset times for every day — June through December 2026.">
  <meta name="theme-color" content="#080c18">
  <meta property="og:title" content="🌙 Moon &amp; Sun Calendar 2026">
  <meta property="og:description" content="Moon phases, sunrise &amp; sunset, moonrise &amp; moonset — June to December 2026.">
  <meta property="og:type" content="website">
  <title>Moon &amp; Sun 2026</title>
  <style>
    :root {
      --bg:        #080c18;
      --surf:      #111827;
      --surf2:     #1a2236;
      --border:    #263050;
      --text:      #e8edf8;
      --dim:       #6b7a99;
      --accent:    #5b7be8;
      --moon:      #f0c040;
      --sun:       #ff8c42;
      --today-bg:  #1a2860;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 2rem;
    }

    /* ── Header ── */
    .header {
      padding: 1.4rem 1rem 0.6rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    #loc {
      font-size: 0.72rem;
      color: var(--dim);
      margin-top: 0.25rem;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem 0.8rem;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
      padding-bottom: 2px;
    }

    .nav-btn:active   { background: var(--border); }
    .nav-btn:disabled { opacity: 0.22; cursor: default; }

    .month-label {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }

    /* ── Calendar ── */
    .calendar { padding: 0 0.5rem; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 0.3rem;
    }

    .wd {
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 0.07em;
      padding: 0.35rem 0;
      text-transform: uppercase;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border-radius: 11px;
      cursor: pointer;
      background: var(--surf);
      border: 1.5px solid transparent;
      gap: 1px;
      padding: 3px 2px;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
    }

    .cell:active     { background: var(--surf2); }
    .cell.empty      { background: transparent; cursor: default; pointer-events: none; }
    .cell.past       { opacity: 0.38; }
    .cell.today      { background: var(--today-bg); border-color: var(--accent); }
    .cell.major      { border-color: rgba(240, 192, 64, 0.45); }
    .cell.today.major{ border-color: var(--accent); }

    .day-num {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1;
      color: var(--text);
    }

    .cell.today .day-num {
      color: #7a9cf5;
      font-weight: 700;
    }

    .phase-icon {
      font-size: 0.92rem;
      line-height: 1;
    }

    /* ── Phase legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1rem 0;
      justify-content: center;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.65rem;
      color: var(--dim);
    }

    .leg-item span { font-size: 0.85rem; }

    /* ── Bottom sheet ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .sheet {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 0 1.25rem 2.75rem;
      width: 100%;
      max-width: 430px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      /* needed so swipe transforms apply here too */
      touch-action: pan-x;
    }

    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0.85rem auto 1.1rem;
    }

    .close-x {
      position: absolute;
      top: 0.85rem;
      right: 1.1rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .sheet-date {
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      margin-bottom: 1rem;
    }

    /* Moon card */
    .moon-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surf2);
      border-radius: 15px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
    }

    .moon-big  { font-size: 2.8rem; line-height: 1; }

    .moon-meta h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--moon);
      margin-bottom: 0.2rem;
    }

    .moon-meta p {
      font-size: 0.77rem;
      color: var(--dim);
      line-height: 1.45;
    }

    /* Times grid */
    .times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .tcard {
      background: var(--surf2);
      border-radius: 15px;
      padding: 0.875rem;
      border: 1px solid var(--border);
    }

    .tcard-hd {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.65rem;
    }

    .trow {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.32rem;
    }

    .trow:last-child { margin-bottom: 0; }

    .tlabel {
      font-size: 0.71rem;
      color: var(--dim);
    }

    .tval {
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🌙 Moon &amp; Sun Calendar 2026</h1>
    <div id="loc">Detecting location…</div>
  </div>

  <div class="month-nav">
    <button class="nav-btn" id="prev" onclick="nav(-1)">‹</button>
    <div class="month-label" id="mlabel"></div>
    <button class="nav-btn" id="next" onclick="nav(1)">›</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div>
      <div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div>
      <div class="wd">Sat</div>
    </div>
    <div class="days" id="grid"></div>
  </div>

  <div class="legend">
    <div class="leg-item"><span>🌑</span> New</div>
    <div class="leg-item"><span>🌒</span> Wax. Crescent</div>
    <div class="leg-item"><span>🌓</span> 1st Quarter</div>
    <div class="leg-item"><span>🌔</span> Wax. Gibbous</div>
    <div class="leg-item"><span>🌕</span> Full</div>
    <div class="leg-item"><span>🌖</span> Wan. Gibbous</div>
    <div class="leg-item"><span>🌗</span> 3rd Quarter</div>
    <div class="leg-item"><span>🌘</span> Wan. Crescent</div>
  </div>
</div>

<!-- Bottom sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <button class="close-x" id="closeBtn">×</button>
    <div class="sheet-date" id="sDate"></div>

    <div class="moon-card">
      <div class="moon-big" id="sBigIcon"></div>
      <div class="moon-meta">
        <h3 id="sPhaseName"></h3>
        <p id="sIllum"></p>
      </div>
    </div>

    <div class="times">
      <div class="tcard">
        <div class="tcard-hd"><span>☀️</span> Sun</div>
        <div class="trow">
          <span class="tlabel">Sunrise</span>
          <span class="tval" id="sSunrise"></span>
        </div>
        <div class="trow">
          <span class="tlabel">Sunset</span>
          <span class="tval" id="sSunset"></span>
        </div>
        <div class="trow">
          <span class="tlabel">Daylight</span>
          <span class="tval" id="sDaylight"></span>
        </div>
      </div>
      <div class="tcard">
        <div class="tcard-hd"><span>🌙</span> Moon</div>
        <div class="trow">
          <span class="tlabel">Moonrise</span>
          <span class="tval" id="sMoonrise"></span>
        </div>
        <div class="trow">
          <span class="tlabel">Moonset</span>
          <span class="tval" id="sMoonset"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script>
const YEAR = 2026;
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const MIN_M = 5, MAX_M = 11; // June–December

// IANA timezone → representative [lat, lng]. Covers the most common zones.
// PDT and MDT share the same UTC-7 offset in summer, so raw offset math
// picks Colorado for Pacific users — hence the explicit lookup instead.
const TZ_COORDS = {
  'America/Los_Angeles':  [34.05, -118.24],
  'America/Vancouver':    [49.25, -123.12],
  'America/Tijuana':      [32.53, -117.03],
  'America/Phoenix':      [33.45, -112.07],
  'America/Denver':       [39.74, -104.98],
  'America/Boise':        [43.62, -116.20],
  'America/Chicago':      [41.85,  -87.65],
  'America/Dallas':       [32.78,  -96.80],
  'America/Mexico_City':  [19.43,  -99.13],
  'America/New_York':     [40.71,  -74.01],
  'America/Toronto':      [43.70,  -79.42],
  'America/Halifax':      [44.65,  -63.57],
  'America/Anchorage':    [61.22, -149.90],
  'America/Honolulu':     [21.31, -157.86],
  'America/Sao_Paulo':    [-23.55, -46.63],
  'America/Buenos_Aires': [-34.61, -58.38],
  'America/Bogota':       [4.71,   -74.07],
  'America/Lima':         [-12.05, -77.04],
  'Europe/London':        [51.51,   -0.13],
  'Europe/Dublin':        [53.35,   -6.27],
  'Europe/Lisbon':        [38.72,   -9.14],
  'Europe/Paris':         [48.85,    2.35],
  'Europe/Berlin':        [52.52,   13.40],
  'Europe/Rome':          [41.90,   12.50],
  'Europe/Madrid':        [40.42,   -3.70],
  'Europe/Amsterdam':     [52.37,    4.90],
  'Europe/Stockholm':     [59.33,   18.07],
  'Europe/Athens':        [37.97,   23.73],
  'Europe/Istanbul':      [41.01,   28.95],
  'Europe/Moscow':        [55.75,   37.62],
  'Africa/Cairo':         [30.06,   31.25],
  'Africa/Lagos':         [6.45,    3.40],
  'Africa/Nairobi':       [-1.29,   36.82],
  'Africa/Johannesburg':  [-26.20,  28.04],
  'Asia/Dubai':           [25.20,   55.27],
  'Asia/Kolkata':         [28.61,   77.21],
  'Asia/Dhaka':           [23.72,   90.41],
  'Asia/Bangkok':         [13.75,  100.52],
  'Asia/Shanghai':        [31.23,  121.47],
  'Asia/Hong_Kong':       [22.32,  114.17],
  'Asia/Tokyo':           [35.69,  139.69],
  'Asia/Seoul':           [37.57,  126.98],
  'Asia/Singapore':       [1.35,   103.82],
  'Asia/Taipei':          [25.05,  121.53],
  'Australia/Perth':      [-31.95, 115.86],
  'Australia/Adelaide':   [-34.93, 138.60],
  'Australia/Sydney':     [-33.87, 151.21],
  'Australia/Melbourne':  [-37.81, 144.96],
  'Pacific/Auckland':     [-36.87, 174.77],
  'Pacific/Honolulu':     [21.31, -157.86],
};

function defaultCoords() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (TZ_COORDS[tz]) return TZ_COORDS[tz];
  // Fallback: parent zone e.g. "America/Indiana/Indianapolis" → "America/New_York"
  for (const key of Object.keys(TZ_COORDS)) {
    if (tz.startsWith(key.split('/')[0])) {
      // rough match by continent — use offset-based longitude
      break;
    }
  }
  const tzHr = -new Date().getTimezoneOffset() / 60;
  return [37, Math.max(-179, Math.min(179, tzHr * 15))];
}

const [_dlat, _dlng] = defaultCoords();
let lat = _dlat;
let lng = _dlng;
let curMonth = 5; // start on June

/* ── Moon phase helpers ── */
function phaseInfo(date) {
  const ill = SunCalc.getMoonIllumination(date);
  const p = ill.phase;
  if (p < 0.0625 || p >= 0.9375) return { emoji: '🌑', name: 'New Moon',         p, frac: ill.fraction };
  if (p < 0.1875)                 return { emoji: '🌒', name: 'Waxing Crescent',  p, frac: ill.fraction };
  if (p < 0.3125)                 return { emoji: '🌓', name: 'First Quarter',    p, frac: ill.fraction };
  if (p < 0.4375)                 return { emoji: '🌔', name: 'Waxing Gibbous',   p, frac: ill.fraction };
  if (p < 0.5625)                 return { emoji: '🌕', name: 'Full Moon',        p, frac: ill.fraction };
  if (p < 0.6875)                 return { emoji: '🌖', name: 'Waning Gibbous',   p, frac: ill.fraction };
  if (p < 0.8125)                 return { emoji: '🌗', name: 'Last Quarter',     p, frac: ill.fraction };
                                  return { emoji: '🌘', name: 'Waning Crescent',  p, frac: ill.fraction };
}

function isMajor(p) {
  // Highlight days near the four principal phases
  return p < 0.055 || p > 0.945 ||
         (p > 0.22  && p < 0.28) ||
         (p > 0.47  && p < 0.53) ||
         (p > 0.72  && p < 0.78);
}

/* ── Formatting ── */
function fmt(dt) {
  if (!dt || isNaN(dt)) return '–';
  return dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDur(ms) {
  if (!ms || ms <= 0) return '–';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return `${h}h ${m}m`;
}

/* ── Render calendar ── */
function render() {
  document.getElementById('mlabel').textContent = `${MONTHS[curMonth]} ${YEAR}`;
  document.getElementById('prev').disabled = curMonth <= MIN_M;
  document.getElementById('next').disabled = curMonth >= MAX_M;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const first = new Date(YEAR, curMonth, 1);
  const total = new Date(YEAR, curMonth + 1, 0).getDate();
  const today = new Date();

  // Leading empty cells
  for (let i = 0; i < first.getDay(); i++) {
    const e = document.createElement('div');
    e.className = 'cell empty';
    grid.appendChild(e);
  }

  for (let d = 1; d <= total; d++) {
    const date   = new Date(YEAR, curMonth, d, 12, 0, 0);
    const pi     = phaseInfo(date);
    const isToday = today.getFullYear() === YEAR &&
                    today.getMonth()    === curMonth &&
                    today.getDate()     === d;
    const isPast  = date < new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const cell = document.createElement('div');
    const cls = ['cell'];
    if (isToday) cls.push('today');
    if (isPast)  cls.push('past');
    if (isMajor(pi.p)) cls.push('major');
    cell.className = cls.join(' ');
    cell.innerHTML = `<div class="day-num">${d}</div><div class="phase-icon">${pi.emoji}</div>`;
    cell.addEventListener('click', () => openDay(d));
    grid.appendChild(cell);
  }
}

/* ── Open day popup ── */
function openDay(d) {
  const date = new Date(YEAR, curMonth, d, 12, 0, 0);
  const pi   = phaseInfo(date);
  const sun  = SunCalc.getTimes(date, lat, lng);
  // getMoonTimes works best from midnight of that day
  const moon = SunCalc.getMoonTimes(new Date(YEAR, curMonth, d, 0, 0, 0), lat, lng);

  document.getElementById('sDate').textContent =
    date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  document.getElementById('sBigIcon').textContent  = pi.emoji;
  document.getElementById('sPhaseName').textContent = pi.name;
  document.getElementById('sIllum').textContent     = `${Math.round(pi.frac * 100)}% illuminated`;

  document.getElementById('sSunrise').textContent  = fmt(sun.sunrise);
  document.getElementById('sSunset').textContent   = fmt(sun.sunset);
  document.getElementById('sDaylight').textContent =
    (sun.sunrise && sun.sunset) ? fmtDur(sun.sunset - sun.sunrise) : '–';

  document.getElementById('sMoonrise').textContent = moon.rise ? fmt(moon.rise) : '–';
  document.getElementById('sMoonset').textContent  = moon.set  ? fmt(moon.set)  : '–';

  document.getElementById('overlay').classList.add('open');
}

/* ── Close ── */
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeSheet();
});
document.getElementById('closeBtn').addEventListener('click', closeSheet);

/* ── Swipe-down to close ── */
let swipeY0 = 0;
const sheet = document.getElementById('sheet');
sheet.addEventListener('touchstart', e => { swipeY0 = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchend',   e => {
  if (e.changedTouches[0].clientY - swipeY0 > 80) closeSheet();
}, { passive: true });

/* ── Month navigation ── */
function nav(dir) {
  const n = curMonth + dir;
  if (n >= MIN_M && n <= MAX_M) { curMonth = n; render(); window.scrollTo(0, 0); }
}

/* ── Geolocation ── */
function requestLocation() {
  const locEl = document.getElementById('loc');
  if (!navigator.geolocation) {
    locEl.textContent = '📍 Showing approximate times';
    return;
  }
  locEl.textContent = '⏳ Finding your location…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      const la = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}`;
      const lo = `${Math.abs(lng).toFixed(2)}°${lng >= 0 ? 'E' : 'W'}`;
      locEl.textContent = `📍 ${la}, ${lo}`;
      render();
    },
    () => {
      locEl.textContent = '📍 Tap here to enable location';
    },
    { timeout: 10000, enableHighAccuracy: false }
  );
}

document.getElementById('loc').addEventListener('click', requestLocation);
requestLocation();

render();
</script>
</body>
</html>
